<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consultorio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container py-5">

    <h1 class="text-center mb-4 text-white">Consultorio Médico</h1>

    <!-- TURNOS -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            Turnos
        </div>
        <div class="card-body">
            <button class="btn btn-primary mb-3" onclick="cargarTurnos()">Ver turnos</button>
            <ul id="listaTurnos" class="list-group"></ul>
        </div>
    </div>

    <!-- PACIENTES -->
    <div class="card mb-4">
        <div class="card-header bg-success text-white">
            Pacientes
        </div>
        <div class="card-body">
            <button class="btn btn-success mb-3" onclick="cargarPacientes()">Ver pacientes</button>
            <ul id="listaPacientes" class="list-group"></ul>
        </div>
    </div>

    <!-- MEDICOS -->
    <div class="card mb-4">
        <div class="card-header bg-warning text-dark">
            Médicos
        </div>
        <div class="card-body">
            <button class="btn btn-warning mb-3" onclick="cargarMedicos()">Ver médicos</button>
            <ul id="listaMedicos" class="list-group"></ul>
        </div>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>

# RAILWAY POSTGRESQL + LOCAL SQLite HYBRID
server.port=${PORT:8080}

# RAILWAY: Usa PostgreSQL | LOCAL: Usa SQLite
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:consultorio.db}
spring.datasource.driver-class-name=${DRIVER_CLASS:org.sqlite.JDBC}

# Dialecto dinámico
spring.jpa.database-platform=${DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false

# Connection Pool (ambos)
spring.datasource.hikari.maximum-pool-size=${POOL_SIZE:1}
spring.datasource.hikari.minimum-idle=0
